server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Inventory
        - id: inventory
          uri: http://inventory-service:8080
          predicates:
            - Path=/api/inventory/**
        # Order
        - id: order
          uri: http://order-service:8080
          predicates:
            - Path=/api/order/**
        # Payment
        - id: payment
          uri: http://payment-service:8080
          predicates:
            - Path=/api/payment/**
        # User profile endpoints
        - id: user
          uri: http://user-service:8080
          predicates:
            - Path=/api/user/**
        # User auth endpoints (AuthController lives at /api/auth)
        - id: auth
          uri: http://user-service:8080
          predicates:
            - Path=/api/auth/**
        # Notification REST (future/health) + WebSocket/STOMP hub
        # notification-service binds 8085 in-container (application.yml)
        - id: notification
          uri: http://notification-service:8085
          predicates:
            - Path=/api/notification/**
        - id: notification-websocket
          uri: http://notification-service:8085
          predicates:
            - Path=/ws,/ws/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:4200
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
