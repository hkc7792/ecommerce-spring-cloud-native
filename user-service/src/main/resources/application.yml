server:
  port: 8080

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:userdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForEcommerceAppWhichIsAtLeast32BytesLong}
  expiration-ms: 86400000 # 24 hours
  refresh-expiration-ms: 604800000 # 7 days

app:
  mail:
    provider: console          # console = log to stdout; swap for smtp in prod
    from: noreply@shopease.local
  verification:
    token-ttl-minutes: 60      # email verification token expiry
    frontend-verify-url: http://localhost:4200/auth/verify   # frontend route the verify link points to
  reset:
    token-ttl-minutes: 10      # password-reset OTP expiry
